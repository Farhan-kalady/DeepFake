<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deepfake Shield AI</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #e0e0e0; text-align: center; padding: 40px; }
        .card { background: #1a1a1a; padding: 30px; border-radius: 20px; display: inline-block; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 500px; }
        .btn { background: #0078d4; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn:disabled { background: #555; }
        .result { margin-top: 25px; padding: 15px; border-radius: 10px; font-size: 1.4rem; font-weight: bold; }
        .FAKE { border: 2px solid #ff4d4d; color: #ff4d4d; }
        .REAL { border: 2px solid #00c853; color: #00c853; }
        #loader { display: none; color: #0078d4; margin-top: 15px; font-style: italic; }
        img, video { margin-top: 20px; border-radius: 12px; max-width: 100%; border: 1px solid #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Deepfake Shield</h1>
        <p>Upload an image or video to verify authenticity.</p>

        <form method="POST" enctype="multipart/form-data" onsubmit="startScan()">
            <input type="file" name="file" accept="image/*,video/*" required><br>
            <button type="submit" class="btn" id="scanBtn">Start AI Analysis</button>
        </form>

        <div id="loader">⚙️ Initializing RTX 4050... Analyzing frames...</div>

        {% if result %}
            <div class="result {{ result }}">
                DETECTION: {{ result }} ({{ confidence }}%)
            </div>
            
            {% if file_path.lower().endswith(('.mp4', '.avi', '.mov')) %}
                <video controls><source src="{{ file_path }}" type="video/mp4"></video>
            {% else %}
                <img src="{{ file_path }}" alt="Scan Result">
            {% endif %}
        {% endif %}
    </div>

    <script>
        function startScan() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanBtn').innerText = 'Scanning...';
        }
    </script>
</body>
</html>
